<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#F7EBC4"/>
      <stop offset="55%" stop-color="#F3D6D6"/>
      <stop offset="100%" stop-color="#E8C8B8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A3A3A"/>
      <stop offset="100%" stop-color="#3D2828"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C45C5C"/>
      <stop offset="100%" stop-color="#A84848"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <!-- distant hills / skyline -->
  <path d="M0 520 C180 460 320 500 480 470 C640 440 760 390 920 410 C1080 430 1220 480 1400 450 L1600 470 L1600 1200 L0 1200 Z" fill="#E8D4C8" opacity="0.7"/>
  <path d="M0 580 C220 530 400 560 580 540 C780 515 960 470 1180 500 C1320 520 1460 560 1600 540 L1600 1200 L0 1200 Z" fill="url(#hill)" opacity="0.85"/>
  <!-- tropical canopy suggestion -->
  <ellipse cx="220" cy="620" rx="140" ry="90" fill="#7A9B5A" opacity="0.55"/>
  <ellipse cx="340" cy="640" rx="110" ry="70" fill="#6B8F4E" opacity="0.5"/>
  <ellipse cx="1380" cy="600" rx="160" ry="100" fill="#7A9B5A" opacity="0.45"/>
  <ellipse cx="1480" cy="630" rx="100" ry="70" fill="#6B8F4E" opacity="0.4"/>
  <!-- road -->
  <path d="M-40 900 C400 820 700 860 900 840 C1150 810 1400 780 1640 760 L1640 1200 L-40 1200 Z" fill="url(#road)"/>
  <path d="M200 980 C500 920 750 940 950 925 C1200 905 1450 880 1620 865" stroke="#E8C547" stroke-width="8" stroke-dasharray="40 36" opacity="0.7" stroke-linecap="round"/>
  <!-- cleared lot / clean pavement plane -->
  <path d="M720 780 L1180 720 L1280 880 L780 960 Z" fill="#FFF8F2" opacity="0.35"/>
  <!-- residual waste pile (left) -->
  <g transform="translate(380,820)" opacity="0.9">
    <ellipse cx="80" cy="90" rx="110" ry="36" fill="#4A2C2C" opacity="0.25"/>
    <rect x="20" y="20" width="70" height="55" rx="6" fill="#C45C5C"/>
    <rect x="70" y="5" width="55" height="70" rx="6" fill="#A84848"/>
    <rect x="40" y="45" width="90" height="40" rx="8" fill="#E8C547" opacity="0.85"/>
    <circle cx="115" cy="35" r="22" fill="#6B4C4C"/>
  </g>
  <!-- lorry silhouette -->
  <g transform="translate(980,780)" fill="#4A2C2C">
    <rect x="0" y="40" width="160" height="55" rx="8" fill="#FFF8F2" opacity="0.9"/>
    <rect x="130" y="10" width="70" height="85" rx="8" fill="#C45C5C"/>
    <circle cx="40" cy="100" r="22" fill="#4A2C2C"/>
    <circle cx="150" cy="100" r="22" fill="#4A2C2C"/>
    <circle cx="40" cy="100" r="10" fill="#E8C547"/>
    <circle cx="150" cy="100" r="10" fill="#E8C547"/>
  </g>
  <!-- soft vignette -->
  <rect width="1600" height="1200" fill="url(#sky)" opacity="0.08" filter="url(#soft)"/>
</svg>
